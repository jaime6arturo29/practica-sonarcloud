name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido para una mejor relevancia de los análisis de Git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and generate coverage
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: pytest==8.3.2 pytest-cov==5.0.0
          python -m pytest --cov=. --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jaime6arturo29
            -Dsonar.projectKey=jaime6arturo29_practica-sonarcloud
            -Dsonar.sources=.
            -Dsonar.tests=test_main.py
            -Dsonar.exclusions=test_main.py
            -Dsonar.python.coverage.reportPaths=coverage.xml